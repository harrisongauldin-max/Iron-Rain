<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Iron Rain — planet map (M2)</title>

</head><body style="background:#000">
<script type="module">
// A test page for the planet map screen (claude/planet-maps.md, M2): Mercury in week 1 by default.
// ?side=def plays the garrison; ?troops= ?garrison= ?fort= ?gun= change the war. #webgl forces the WebGL2 backend.
// window.__pw exposes { PMV, PW, V: () => the view, done } for the headless test.
import * as PMV from '../js/planetwarview.js';
import * as PW from '../js/planetwar.js';
const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d;
const spec = { world: q.get('world') || 'mercury', by: 'rep', def: 'soc', troops: num('troops', 8072), garrison: num('garrison', 5720), fort: num('fort', 0), gun: num('gun', 1), shield: num('shield', 0), barracks: num('barracks', 1), loyalty: num('loyalty', 50) };
window.__pw = { PMV, PW, V: PMV._view, done: null };
const go = () => PMV.open(spec, { human: q.get('side') === 'def' ? 'def' : 'att', preview: true }).then(r => { window.__pw.done = r; });
go();
</script></body></html>
