<script type="module">
import { renderOffline, SOUND_KINDS } from '../js/audio.js';
// renders a spec and returns level statistics, and the samples as 16-bit PCM in base64 when asked
window.KINDS = SOUND_KINDS;
window.render = async (spec, wantPcm) => {
  const b = await renderOffline(spec), L = b.getChannelData(0), R = b.getChannelData(1);
  let peak = 0, ss = 0, nan = 0, last = 0;
  for (let i = 0; i < L.length; i++) { const a = Math.abs(L[i]), c = Math.abs(R[i]); if (!isFinite(L[i]) || !isFinite(R[i])) nan++; const m = Math.max(a, c); if (m > peak) peak = m; ss += (L[i] * L[i] + R[i] * R[i]) / 2; if (m > .001) last = i; }
  const out = { peak, rms: Math.sqrt(ss / L.length), nan, tail: last / b.sampleRate, sr: b.sampleRate, n: L.length };
  if (wantPcm) { const pcm = new Int16Array(L.length * 2); for (let i = 0; i < L.length; i++) { pcm[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
    let s = ''; const u = new Uint8Array(pcm.buffer); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); out.pcm = btoa(s); }
  return out;
};
window.ready = true;
</script>
